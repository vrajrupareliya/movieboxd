<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/movieboxd-icon.png" />
  <link rel="apple-touch-icon" href="/movieboxd-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="referrer" content="no-referrer" />
  <meta name="description"
    content="Movieboxd - The social platform for film lovers. Track, rate, review movies and share your taste with friends." />
  <title>Movieboxd - The Social Network for Film Lovers</title>

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Movieboxd" />
  <meta property="og:title" content="Movieboxd - The Social Network for Film Lovers" />
  <meta property="og:description"
    content="Track, rate, review movies and share your taste with friends on Movieboxd." />
  <meta property="og:image" content="/movieboxd-opengraph.png" />
  <meta property="og:image:secure_url" content="/movieboxd-opengraph.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Movieboxd - The Social Network for Film Lovers" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Movieboxd - The Social Network for Film Lovers" />
  <meta name="twitter:description"
    content="Track, rate, review movies and share your taste with friends on Movieboxd." />
  <meta name="twitter:image" content="/movieboxd-opengraph.png" />

  <!-- Preconnect & Google Fonts (Newsreader for literary film display, Plus Jakarta Sans for catalog body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
